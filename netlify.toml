[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# Keep Vite available during the build. Runtime API configuration belongs in
# the existing site's context-specific VITE_API_URL setting, never in Git.
[build.environment]
  NODE_VERSION = "24"
  NPM_FLAGS = "--include=dev"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
